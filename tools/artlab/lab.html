<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Art lab</title>
<style>
  @font-face { font-family: 'Galmuri11'; src: url('fonts/Galmuri11.woff2') format('woff2'); }
  @font-face { font-family: 'Galmuri11B'; src: url('fonts/Galmuri11-Bold.woff2') format('woff2'); }
  body { margin: 0; background: #14101f; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="sheet"></canvas>
<script type="module">
import { PAL, SPRITES, TILE } from './sprites.js';

const W = 192, H = 112, SCALE = 5;
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

function blit(ctx, name, x, y, flip = false) {
  const rows = SPRITES[name];
  rows.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch === '.') return;
    ctx.fillStyle = PAL[ch];
    ctx.fillRect(x + (flip ? row.length - 1 - i : i), y + j, 1, 1);
  }));
}
const size = (name) => ({ w: SPRITES[name][0].length, h: SPRITES[name].length });

// Pixel text: draw with the bitmap font, then snap alpha so no blurry edge pixels remain.
function pixelText(ctx, text, x, y, color, halo, font = 'Galmuri11B') {
  const c = document.createElement('canvas');
  c.width = 120; c.height = 20;
  const t = c.getContext('2d');
  t.font = `12px ${font}`;
  t.textBaseline = 'top';
  t.fillStyle = '#fff';
  t.fillText(text, 1, 1);
  const img = t.getImageData(0, 0, c.width, c.height).data;
  const on = (i, j) => i >= 0 && j >= 0 && i < c.width && j < c.height && img[(j * c.width + i) * 4 + 3] > 110;
  for (let j = 0; j < c.height; j++) for (let i = 0; i < c.width; i++) {
    if (on(i, j)) continue;
    if (halo && (on(i - 1, j) || on(i + 1, j) || on(i, j - 1) || on(i, j + 1))) { ctx.fillStyle = halo; ctx.fillRect(x + i, y + j, 1, 1); }
  }
  ctx.fillStyle = color;
  for (let j = 0; j < c.height; j++) for (let i = 0; i < c.width; i++) if (on(i, j)) ctx.fillRect(x + i, y + j, 1, 1);
  return t.measureText(text).width;
}

function shadow(ctx, cx, y, w) {
  ctx.fillStyle = 'rgba(15,8,25,0.45)';
  ctx.fillRect(cx - w / 2 + 1, y, w - 2, 1);
  ctx.fillRect(cx - w / 2, y + 1, w, 1);
  ctx.fillRect(cx - w / 2 + 1, y + 2, w - 2, 1);
}

function drawRoom(ctx) {
  // floor tiles with seams, specks and a couple of cracks
  for (let ty = 2; ty < 7; ty++) for (let tx = 0; tx < 12; tx++) {
    const x = tx * 16, y = ty * 16 + 8;
    ctx.fillStyle = (tx + ty) % 2 ? TILE.floor : TILE.floorAlt;
    ctx.fillRect(x, y, 16, 16);
    ctx.fillStyle = TILE.seam;
    ctx.fillRect(x + 15, y, 1, 16); ctx.fillRect(x, y + 15, 16, 1);
    ctx.fillStyle = TILE.speck;
    ctx.fillRect(x + ((tx * 7 + ty * 3) % 11) + 2, y + ((tx * 5 + ty * 9) % 10) + 2, 2, 1);
    if ((tx * 3 + ty) % 7 === 0) {
      ctx.fillStyle = TILE.crack;
      [[3, 4], [4, 5], [5, 5], [6, 6], [6, 7], [7, 8], [9, 8]].forEach(([i, j]) => ctx.fillRect(x + i, y + j, 1, 1));
    }
  }
  // back wall: dark top, plaster upper face, green waterproof paint lower face (Seoul basement)
  ctx.fillStyle = TILE.wallTop; ctx.fillRect(0, 0, W, 8);
  ctx.fillStyle = TILE.wallTopHi; ctx.fillRect(0, 7, W, 1);
  ctx.fillStyle = TILE.plaster; ctx.fillRect(0, 8, W, 18);
  ctx.fillStyle = TILE.plasterLo; ctx.fillRect(0, 24, W, 2);
  ctx.fillStyle = TILE.trim; ctx.fillRect(0, 26, W, 1);
  ctx.fillStyle = TILE.paint; ctx.fillRect(0, 27, W, 13);
  ctx.fillStyle = TILE.paintHi; ctx.fillRect(0, 27, W, 1);
  ctx.fillStyle = TILE.paintLo; ctx.fillRect(0, 38, W, 2);
  ctx.fillStyle = 'rgba(15,8,25,0.5)'; ctx.fillRect(0, 40, W, 2); // contact shadow on the floor
  // exposed pipe along the wall
  ctx.fillStyle = '#6d6880'; ctx.fillRect(0, 10, W, 3);
  ctx.fillStyle = '#9a95ad'; ctx.fillRect(0, 10, W, 1);
  ctx.fillStyle = PAL.O; for (let x = 20; x < W; x += 44) ctx.fillRect(x, 9, 2, 5);
  // flyers taped on the plaster
  [[118, 15, '#efe8d0'], [124, 17, '#f2c1c8'], [178, 15, '#d6ecf0']].forEach(([x, y, c]) => {
    ctx.fillStyle = PAL.O; ctx.fillRect(x - 1, y - 1, 7, 9);
    ctx.fillStyle = c; ctx.fillRect(x, y, 5, 7);
    ctx.fillStyle = '#7b7262'; ctx.fillRect(x + 1, y + 2, 3, 1); ctx.fillRect(x + 1, y + 4, 2, 1);
  });
  // printed sheets on the floor (printing-house basement)
  [[30, 70], [118, 98], [70, 100], [160, 60]].forEach(([x, y]) => {
    ctx.fillStyle = PAL.O; ctx.fillRect(x - 1, y - 1, 7, 6);
    ctx.fillStyle = '#e8e2d0'; ctx.fillRect(x, y, 5, 4);
    ctx.fillStyle = '#8a8270'; ctx.fillRect(x + 1, y + 1, 3, 1);
  });
}

function drawSigns(ctx) {
  // sign boards (lit separately as emissive)
  ctx.fillStyle = PAL.O; ctx.fillRect(26, 14, 52, 17);
  ctx.fillStyle = '#1e1628'; ctx.fillRect(27, 15, 50, 15);
  ctx.fillStyle = PAL.O; ctx.fillRect(146, 14, 34, 16);
  ctx.fillStyle = '#1e1628'; ctx.fillRect(147, 15, 32, 14);
}
function drawNeon(ctx) {
  pixelText(ctx, '을지인쇄', 29, 16, '#ffd1e6', '#ff4fa0');
  pixelText(ctx, '24시', 149, 16, '#d9fff9', '#2fd8c8');
}

// Banded lighting: ambient night tint + point lights, quantized to 4 steps so light stays "pixel".
function light(ctx, lights) {
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const amb = [0.42, 0.36, 0.62];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const m = [...amb];
    for (const L of lights) {
      const dist = Math.hypot((x - L.x), (y - L.y) * 1.25);
      let k = Math.max(0, 1 - dist / L.r);
      k = Math.ceil(k * 3) / 3;
      for (let c = 0; c < 3; c++) m[c] += (L.rgb[c] / 255) * k * L.i;
    }
    const i = (y * W + x) * 4;
    for (let c = 0; c < 3; c++) d[i + c] = Math.min(255, d[i + c] * m[c]);
  }
  ctx.putImageData(img, 0, 0);
}

function scene() {
  const base = document.createElement('canvas');
  base.width = W; base.height = H;
  const ctx = base.getContext('2d');
  drawRoom(ctx);
  drawSigns(ctx);
  blit(ctx, 'lamp', 90, 1);
  blit(ctx, 'aircon', 6, 30);
  blit(ctx, 'payphone', 95, 25);
  blit(ctx, 'chair', 56, 66);
  const actors = [
    { name: 'cheonyeo', x: 134, y: 50, sh: 78, float: true },
    { name: 'director', x: 80, y: 62, sh: 78 },
    { name: 'wisp', x: 36, y: 84, sh: 96, float: true },
    { name: 'wisp', x: 156, y: 88, sh: 100, float: true },
    { name: 'wisp', x: 172, y: 66, sh: 78, float: true },
  ];
  actors.sort((a, b) => a.sh - b.sh).forEach((a) => {
    const s = size(a.name);
    shadow(ctx, a.x + s.w / 2, a.sh, a.float ? s.w - 4 : s.w - 2);
    blit(ctx, a.name, a.x, a.y);
    if (a.name === 'director') blit(ctx, 'sword', a.x + 13, a.y + 7);
  });
  light(ctx, [
    { x: 97, y: 6, r: 78, rgb: hex('#d8e6ff'), i: 0.6 },
    { x: 52, y: 22, r: 48, rgb: hex('#ff4fa0'), i: 0.75 },
    { x: 163, y: 22, r: 34, rgb: hex('#2fd8c8'), i: 0.6 },
    { x: 41, y: 89, r: 24, rgb: hex('#4aa8ff'), i: 0.9 },
    { x: 161, y: 93, r: 24, rgb: hex('#4aa8ff'), i: 0.9 },
    { x: 177, y: 71, r: 24, rgb: hex('#4aa8ff'), i: 0.9 },
    { x: 141, y: 62, r: 26, rgb: hex('#cfd0ff'), i: 0.45 },
    { x: 105, y: 30, r: 12, rgb: hex('#9be0c0'), i: 0.5 },
  ]);
  // emissive things are drawn after lighting so they stay bright
  drawNeon(ctx);
  blit(ctx, 'lamp', 90, 1);
  [[36, 84], [156, 88], [172, 66]].forEach(([x, y]) => blit(ctx, 'wisp', x, y));
  const out = document.getElementById('scene');
  out.width = W * SCALE; out.height = H * SCALE;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.drawImage(base, 0, 0, W * SCALE, H * SCALE);
}

function sheet() {
  const S = 8, pad = 14;
  const list = ['director', 'sword', 'cheonyeo', 'wisp', 'payphone', 'chair', 'aircon', 'lamp'];
  const labels = { director: '사무소장', sword: '신문지 사인검', cheonyeo: '처녀귀신', wisp: '도깨비불', payphone: '공중전화', chair: '플라스틱 의자', aircon: '실외기', lamp: '형광등' };
  const out = document.getElementById('sheet');
  out.width = 1340; out.height = 230;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = false;
  o.fillStyle = '#3a3450'; o.fillRect(0, 0, out.width, out.height);
  let x = pad;
  for (const name of list) {
    const s = size(name);
    const c = document.createElement('canvas');
    c.width = s.w; c.height = s.h;
    blit(c.getContext('2d'), name, 0, 0);
    const sc = name === 'lamp' || name === 'aircon' ? 5 : S;
    o.drawImage(c, x, 48, s.w * sc, s.h * sc);
    const lc = document.createElement('canvas');
    lc.width = 120; lc.height = 16;
    pixelText(lc.getContext('2d'), labels[name], 0, 0, '#f6e7c1', null, 'Galmuri11');
    const lw = pixelText(document.createElement('canvas').getContext('2d'), labels[name], 0, 0, '#000', null, 'Galmuri11');
    o.drawImage(lc, x, 8, 240, 32);
    x += Math.max(s.w * sc, lw * 2) + pad * 2;
  }
}

await document.fonts.load('12px Galmuri11B');
await document.fonts.load('12px Galmuri11');
scene();
sheet();
document.body.dataset.ready = '1';
</script>
</body>
</html>
